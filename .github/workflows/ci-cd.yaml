name: cicd
on:
  push:
  workflow_dispatch:
jobs: # Pipeline. One workflow can have multiple pipelines
  common:
    uses: joindevops-actions/reusable-workflows/.github/workflows/common.yaml@main
    with:
      project: roboshop
      component: catalogue
      app_type: nodejs
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    